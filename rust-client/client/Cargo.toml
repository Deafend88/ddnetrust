[package]
name = "ddnet-rs"
version = "0.1.0"
edition = "2024"
license = "Zlib"
description = "DDNet client with rendering, built on the ddnet crate"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ddnet = { path = "../ddnet" }
egui = "0.37"
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
png = "0.18"
wgpu = "30.0.2"
winit = "0.30.13"

[dev-dependencies]
flate2 = "1.1.11"
