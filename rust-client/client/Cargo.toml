[package]
name = "ddnet-rs"
version = "0.1.0"
edition = "2024"
license = "Zlib"
description = "DDNet client with rendering, built on the ddnet crate"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ddnet = { path = "../ddnet" }
egui = "0.37"
egui-wgpu = { version = "0.37.0", default-features = false }
egui-winit = { version = "0.37.0", default-features = false }
png = "0.18"
wgpu = "30.0.2"
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
# SMTC (now playing, 7.10), Windows' image decoder for its covers, and WinRT's HTTP client
# and JSON parser for the lyrics, Core Audio for the per-app volume (audio.rs); PLAN §10.6
# answer 2
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Graphics_Imaging", "Storage_Streams", "Web_Http", "Web_Http_Headers", "Data_Json", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
flate2 = "1.1.11"
